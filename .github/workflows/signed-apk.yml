name: Signed APK
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signed-apk-master
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      unsigned_sha256: ${{ steps.metadata.outputs.unsigned_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build and test unsigned release
        run: |
          python3 tools/check_translations.py
          bash gradlew :app:assembleStandardRelease :app:lintStandardRelease --no-daemon
      - name: Record unsigned artifact identity
        id: metadata
        run: |
          python3 - <<'PY'
          import hashlib, os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('gradle/libs.versions.toml').read_text())['versions']['app-version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          apk = Path('app/build/outputs/apk/standard/release/app-standard-release-unsigned.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nunsigned_sha256={digest}\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-release
          path: app/build/outputs/apk/standard/release/app-standard-release-unsigned.apk
          retention-days: 1
          if-no-files-found: error
  sign:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-signing
    env:
      EXPECTED_CERT: 0f65afdc3a15ba9ff9cf196a05418484481737530d8562015814a6fca5978fdf
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      UNSIGNED_SHA256: ${{ needs.build.outputs.unsigned_sha256 }}
    steps:
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: unsigned-release
          path: unsigned
      - name: Install Android signing tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Sign and verify APK
        env:
          KEYSTORE_BASE64: ${{ secrets.NOWBAR_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NOWBAR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOWBAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOWBAR_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          KEY_DIR="$RUNNER_TEMP/nowbar-signing"
          mkdir -p "$KEY_DIR"
          trap 'rm -rf "$KEY_DIR"' EXIT
          export KEY_DIR
          python3 - <<'PY'
          import base64, hashlib, os, re
          from pathlib import Path
          for name in ['KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']:
              assert os.environ.get(name), 'Missing signing configuration: ' + name
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', os.environ['RELEASE_VERSION'])
          apk = Path('unsigned/app-standard-release-unsigned.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest() == os.environ['UNSIGNED_SHA256']
          key = base64.b64decode(''.join(os.environ['KEYSTORE_BASE64'].split()), validate=True)
          assert 0 < len(key) < 30000
          (Path(os.environ['KEY_DIR']) / 'release.jks').write_bytes(key)
          PY
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          APK="dist/NowbarMeter-v${RELEASE_VERSION}-standard.apk"
          "$TOOLS/zipalign" -f -p 4 unsigned/app-standard-release-unsigned.apk "$KEY_DIR/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KEY_DIR/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$APK" "$KEY_DIR/aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > signature.txt
          "$TOOLS/aapt" dump badging "$APK" > badging.txt
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          signature = Path('signature.txt').read_text()
          certs = re.findall(r'^Signer #\d+ certificate SHA-256 digest: ([0-9a-fA-F]+)$', signature, re.M)
          assert [c.lower() for c in certs] == [os.environ['EXPECTED_CERT']]
          badging = Path('badging.txt').read_text()
          version = os.environ['RELEASE_VERSION']
          assert "package: name='de.teddybaerd.nowbarmeter'" in badging.splitlines()[0]
          assert "versionName='" + version + "'" in badging.splitlines()[0]
          assert 'application-debuggable' not in badging
          apk = Path('dist') / f'NowbarMeter-v{version}-standard.apk'
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (apk.parent / 'SHA256SUMS.txt').write_text(f'{digest}  {apk.name}\n')
          (apk.parent / 'signing-certificate-sha256.txt').write_text(os.environ['EXPECTED_CERT'] + '\n')
          (apk.parent / 'build-info.json').write_text(json.dumps({'version': version, 'source_commit': os.environ['GITHUB_SHA'], 'package': 'de.teddybaerd.nowbarmeter', 'certificate_sha256': os.environ['EXPECTED_CERT'], 'apk_sha256': digest}, indent=2) + '\n')
          PY
      - name: Remove private signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/nowbar-signing"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: NowbarMeter-${{ needs.build.outputs.version }}-signed
          path: dist/
          retention-days: 90
          if-no-files-found: error
