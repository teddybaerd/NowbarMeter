name: Signed standard release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Verify version and release branch
        shell: bash
        run: |
          VERSION=$(sed -n 's/^app-version = "\([^"]*\)"/\1/p' gradle/libs.versions.toml)
          test -n "$VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
            git merge-base --is-ancestor HEAD origin/master
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Prepare persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NOWBAR_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NOWBAR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOWBAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NOWBAR_KEY_PASSWORD }}
        shell: bash
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64" || { echo 'Persistent signing secrets are not configured.' >&2; exit 1; }
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nowbar-release.jks"
          echo "SIGN_KEY_STORE_FILE=$RUNNER_TEMP/nowbar-release.jks" >> "$GITHUB_ENV"
      - name: Build and lint signed standard APK
        env:
          SIGN_KEY_STORE_PASSWORD: ${{ secrets.NOWBAR_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.NOWBAR_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.NOWBAR_KEY_PASSWORD }}
        run: |
          python3 tools/check_translations.py
          bash gradlew :app:assembleStandardRelease :app:lintStandardRelease --no-daemon
      - name: Verify APK signature and prepare artifact
        shell: bash
        run: |
          APK=app/build/outputs/apk/standard/release/app-standard-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p release-assets
          cp "$APK" "release-assets/NowbarMeter-v${RELEASE_VERSION}-standard.apk"
          cd release-assets
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NowbarMeter-signed-release
          path: release-assets/*
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          fail_on_unmatched_files: true
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/nowbar-release.jks"
