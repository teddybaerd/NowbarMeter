name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.3)'
        required: false
        default: 'v1.3'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGN_KEY_STORE_BASE64: ${{ secrets.SIGN_KEY_STORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGN_KEY_STORE_PASSWORD: ${{ secrets.SIGN_KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: |
          KS_FILE="$RUNNER_TEMP/release.jks"
          B64="${KEYSTORE_BASE64:-$SIGN_KEY_STORE_BASE64}"
          if [ -n "$B64" ]; then
            echo "Using repository signing keystore secret..."
            echo "$B64" | base64 --decode > "$KS_FILE"
            KS_PASS="${KEYSTORE_PASSWORD:-$SIGN_KEY_STORE_PASSWORD}"
            ALIAS="${KEY_ALIAS:-$SIGN_KEY_ALIAS}"
            K_PASS="${KEY_PASSWORD:-$SIGN_KEY_PASSWORD}"
          else
            echo "No keystore secret found; generating release keystore..."
            KS_PASS="nowbarmeter"
            ALIAS="nowbarmeter"
            K_PASS="nowbarmeter"
            keytool -genkeypair -v \
              -keystore "$KS_FILE" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$K_PASS" \
              -dname "CN=NowbarMeter, OU=Mobile, O=realMoai, L=Unknown, ST=Unknown, C=US"
          fi
          echo "SIGN_KEY_STORE_FILE=$KS_FILE" >> "$GITHUB_ENV"
          echo "SIGN_KEY_STORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "SIGN_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "SIGN_KEY_PASSWORD=$K_PASS" >> "$GITHUB_ENV"

      - name: Build Minified Release APK & AAB
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare Release Artifacts & Notes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_NAME="${{ github.event.inputs.tag_name }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          if [[ -z "$TAG_NAME" ]]; then
            TAG_NAME="v1.3"
          fi

          mkdir -p release-assets
          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_SOURCE=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          cp "$APK_SOURCE" "release-assets/NowbarMeter-${TAG_NAME}.apk"
          cp "$AAB_SOURCE" "release-assets/NowbarMeter-${TAG_NAME}.aab"

          if [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md release-notes.md
          else
            git log -1 --format="%b" > release-notes.md
            if [ ! -s release-notes.md ]; then
              git log -1 --format="%s" > release-notes.md
            fi
          fi

          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          ls -lh release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Nowbar Meter ${{ env.TAG_NAME }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            release-assets/NowbarMeter-${{ env.TAG_NAME }}.apk
            release-assets/NowbarMeter-${{ env.TAG_NAME }}.aab

      - name: Cleanup Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
