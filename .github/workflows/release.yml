# Modified by teddybaerd for the Nowbar Meter continuation (2026): independent app identity, localization, privacy controls and release maintenance.
name: Standard verification
on:
  push:
    branches: [own-package-test, master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Check German translations
        run: python3 tools/check_translations.py
      - name: Build and lint standard test APK
        run: bash gradlew :app:assembleStandardDebug :app:lintStandardDebug --no-daemon
      - name: Build and lint unsigned release APK
        run: bash gradlew :app:testStandardDebugUnitTest :app:assembleStandardRelease :app:lintStandardRelease --no-daemon
      - name: Verify privacy and offline license contents
        run: python3 tools/check_release_contents.py app/build/outputs/apk/standard/release/app-standard-release-unsigned.apk "$ANDROID_HOME/build-tools/36.0.0/aapt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: NowbarMeter-standard-test
          path: |
            app/build/outputs/apk/standard/debug/*.apk
            app/build/reports/lint-results-standard*.html
            app/build/reports/lint-results-standard*.xml
