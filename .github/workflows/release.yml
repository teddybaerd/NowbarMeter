name: Standard verification
on:
  push:
    branches: [own-package-test, master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Check German translations
        run: python3 tools/check_translations.py
      - name: Build and lint standard test APK
        run: bash gradlew :app:assembleStandardDebug :app:lintStandardDebug --no-daemon
      - name: Build and lint unsigned release APK
        run: bash gradlew :app:assembleStandardRelease :app:lintStandardRelease --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NowbarMeter-standard-test
          path: |
            app/build/outputs/apk/standard/debug/*.apk
            app/build/reports/lint-results-standard*.html
            app/build/reports/lint-results-standard*.xml
