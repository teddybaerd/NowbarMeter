def kFile = rootProject.file('local.properties')
def props = new Properties()
def configured = false

if (kFile.canRead()) {
    props.load(new FileInputStream(kFile))

    if (props != null && props['SIGN_KEY_STORE_FILE'] != null && !props['SIGN_KEY_STORE_FILE'].toString().trim().isEmpty()) {
        def keystoreFile = file(props['SIGN_KEY_STORE_FILE'])
        if (keystoreFile.exists()) {
            android.signingConfigs.sign.storeFile keystoreFile
            android.signingConfigs.sign.storePassword props['SIGN_KEY_STORE_PASSWORD']
            android.signingConfigs.sign.keyAlias props['SIGN_KEY_ALIAS']
            android.signingConfigs.sign.keyPassword props['SIGN_KEY_PASSWORD']
            configured = true
        }
    }
}

if (!configured) {
    def storeFile = System.getenv('SIGN_KEY_STORE_FILE')
    if (storeFile != null && !storeFile.trim().isEmpty() && file(storeFile).exists()) {
        android.signingConfigs.sign.storeFile file(storeFile)
        android.signingConfigs.sign.storePassword System.getenv('SIGN_KEY_STORE_PASSWORD')
        android.signingConfigs.sign.keyAlias System.getenv('SIGN_KEY_ALIAS')
        android.signingConfigs.sign.keyPassword System.getenv('SIGN_KEY_PASSWORD')
        configured = true
    }
}

if (!configured) {
    android.buildTypes.release.signingConfig = null
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { task ->
            task.project == project && task.name.toLowerCase(java.util.Locale.ROOT).contains('release')
        }) {
            throw new GradleException('Release builds require a persistent signing key. Configure SIGN_KEY_STORE_FILE, SIGN_KEY_STORE_PASSWORD, SIGN_KEY_ALIAS and SIGN_KEY_PASSWORD.')
        }
    }
}
